# The old file used [Log]/[Debug] with keys that never existed in Dolphin
# (Default=Info, Enable=True...). The real Dolphin Logger.ini uses [Logs]
# (booleans per subsystem) + [Options] (Verbosity/WriteToFile/WriteToConsole).
# "Logging disabled" in practice = do not write anything to disk.
[Options]
WriteToFile = False
WriteToConsole = False
