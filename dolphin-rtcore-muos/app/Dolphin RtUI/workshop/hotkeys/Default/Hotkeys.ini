[Hotkeys]
# Dolphin Rt:Core — Dolphin 2606 hotkey schema.
# Keyboard events are injected by gptokeyb2 through SDL's virtual keyboard.
Device = SDL/0/Keyboard Mouse

# Save / load slots (SELECT + L1 / R1 / L2 / R2 / A / B)
Save State/Save State Slot 1 = F1
Load State/Load State Slot 1 = F2
Save State/Save State Slot 2 = F3
Load State/Load State Slot 2 = F4
Save State/Save State Slot 3 = F5
Load State/Load State Slot 3 = F6

# Game flow
General/Toggle Pause = F7
Emulation Speed/Disable Emulation Speed Limit = F8
Emulation Speed/Decrease Emulation Speed = F9
Emulation Speed/Increase Emulation Speed = F10

# Utility
General/Take Screenshot = F11
General/Reset = F12

# Exit — SELECT + START
General/Exit = Escape

# State-slot navigation / recovery
Other State Hotkeys/Decrease Selected State Slot = 1
Other State Hotkeys/Increase Selected State Slot = 2
Other State Hotkeys/Undo Load State = 3
