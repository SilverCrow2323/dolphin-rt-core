[Hotkeys1]
# Dolphin Rt:Core — gptokeyb2 hotkeys (keyboard injection).
# SELECT is intentionally not remapped; START and SELECT remain gameplay inputs.
# L2 + button combos are declared in ext-dolphin.gptk.
Device = Keyboard

# Save / Load state slots
Keys/Save State Slot 1 = `F1`
Keys/Load State Slot 1 = `F2`
Keys/Save State Slot 2 = `F3`
Keys/Load State Slot 2 = `F4`
Keys/Save State Slot 3 = `F5`
Keys/Load State Slot 3 = `F6`

# Game flow
Keys/Toggle Pause = `F7`
Keys/Toggle Fast Forward = `F8`
Keys/Decrease Frame Limit = `F9`
Keys/Increase Frame Limit = `F10`

# Utility
Keys/Take Screenshot = `F11`
Keys/Reset = `F12`


# Slot switching (direct keyboard keys)
Keys/Set State Slot to 1 = `1`
Keys/Set State Slot to 2 = `2`
Keys/Set State Slot to 3 = `3`
