# Anbernic RG35XX-H (H700) - Knulli / Batocera
PAD_NAME="Anbernic RG35XX-H Controller"   # as shown by: sdl2-jstest --list
JS_DEV=/dev/input/js0
SDL_GUID=19000000010000000100000000010000
# left stick a0/a1, right stick a2/a3, d-pad on hat 0
SDL_MAP="leftx:a0,lefty:a1,rightx:a2,righty:a3,dpup:h0.1,dpright:h0.2,dpdown:h0.4,dpleft:h0.8"
NUMSTICKS=2
# raw button numbers (js0) used by the safe-exit combos
BTN_SELECT=6
BTN_START=7
BTN_MENU=8
