# Dolphin Rt:Core K - settings
# Every value can be overridden by an environment variable (RTCORE_DEVICE, RTCORE_DEFAULT_PROFILE ...).
DEVICE=rg35xx-h          # file config/devices/<DEVICE>.conf
DEFAULT_PROFILE=default  # profile used when EmulationStation does not pass one
EXIT_GRACE=8             # seconds Dolphin gets to close cleanly before it is killed
