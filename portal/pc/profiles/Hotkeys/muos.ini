# Hotkeys muos - everything lives on the MODE layer (hold MODE, press a button).
# B is mapped to SELECT in the GCPad profile, so no hotkey uses SELECT alone and
# Toggle Fullscreen is left unmapped: it would bring the desktop back into the stream.
[Profile]
Device = evdev/0/Sunshine (libvirtualhid) X-Box Series Controller
General/Exit = MODE&START
General/Toggle Pause = MODE&SELECT
General/Take Screenshot = MODE&NORTH
Save State/Save State Slot 1 = MODE&TL
Load State/Load State Slot 1 = MODE&TR
Other State Hotkeys/Undo Load State = MODE&WEST
Volume/Increase Volume = MODE&`Axis 7-`
Volume/Decrease Volume = MODE&`Axis 7+`
Volume/Toggle Mute = MODE&THUMBL
Emulation Speed/Decrease Emulation Speed = MODE&`Axis 6-`
Emulation Speed/Increase Emulation Speed = MODE&`Axis 6+`
Emulation Speed/Disable Emulation Speed Limit = MODE&THUMBR
