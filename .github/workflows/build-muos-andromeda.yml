name: Build Dolphin muOS Andromeda (H700)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-muos-andromeda.yml"
      - "dolphin-rtcore-muos/VERSION"
      - "README.md"
      - "dolphin-build/**"
      - "!dolphin-build/*.md"
      - "!dolphin-build/**/*.md"
      - "dolphin-rtcore-muos/emu/dolphin/Sys/**"
      - "dolphin-rtcore-muos/emu/dolphin/RtSys/switch_weapon/**"
      - "dolphin-rtcore-muos/tools/build-muxupd.sh"
      - "dolphin-rtcore-muos/tools/stage-legacy-assign.sh"
      - "dolphin-rtcore-muos/tools/verify-muxupd.sh"
      - "dolphin-rtcore-muos/tools/verify-muos-runtime-abi.sh"
      - "tests/test_muos_glibc_abi.sh"
      - "dolphin-rtcore-muos/app/Dolphin RtUI/**"
      - "dolphin-rtcore-muos/overlay/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-muos-andromeda.yml"
      - "dolphin-rtcore-muos/VERSION"
      - "README.md"
      - "dolphin-build/**"
      - "!dolphin-build/*.md"
      - "!dolphin-build/**/*.md"
      - "dolphin-rtcore-muos/emu/dolphin/Sys/**"
      - "dolphin-rtcore-muos/emu/dolphin/RtSys/switch_weapon/**"
      - "dolphin-rtcore-muos/tools/build-muxupd.sh"
      - "dolphin-rtcore-muos/tools/stage-legacy-assign.sh"
      - "dolphin-rtcore-muos/tools/verify-muxupd.sh"
      - "dolphin-rtcore-muos/tools/verify-muos-runtime-abi.sh"
      - "tests/test_muos_glibc_abi.sh"
      - "dolphin-rtcore-muos/app/Dolphin RtUI/**"
      - "dolphin-rtcore-muos/overlay/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muos-andromeda-h700-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: muOS Andromeda / H700 / NoGUI + full update
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show native build host
        run: |
          uname -a
          uname -m
          nproc
          free -h

      - name: Verify native ARM64 Docker runner
        run: |
          test "$(uname -m)" = "aarch64"
          docker --version
          docker info --format '{{.Architecture}}'

      - name: Build muOS Dolphin in Ubuntu 22.04 ARM64 userland
        id: build_dolphin
        run: |
          OUT="$RUNNER_TEMP/dolphin-muos"
          mkdir -p "$OUT"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$OUT:/out" \
            -w /workspace \
            ubuntu:22.04 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential gcc-12 g++-12 cmake ninja-build git patch pkg-config python3 \
                ca-certificates xz-utils binutils file \
                libevdev-dev libudev-dev libusb-1.0-0-dev libpulse-dev \
                libasound2-dev libcurl4-openssl-dev liblzo2-dev libzstd-dev \
                liblzma-dev libpng-dev zlib1g-dev libbz2-dev libegl-dev \
                libgles-dev libgl-dev libdrm-dev libbluetooth-dev libhidapi-dev
              CC=gcc-12 CXX=g++-12 bash dolphin-build/build-dolphin.sh \
                --target muos \
                --frontend nogui \
                --out /out \
                --jobs "$(nproc)" \
                --no-deps \
                --tune cortex-a53
            '
          sudo chown -R "$(id -u):$(id -g)" "$OUT"


      - name: Test muOS glibc ABI gate
        run: bash tests/test_muos_glibc_abi.sh

      - name: Validate AArch64 executable and private runtime
        run: |
          OUT="$RUNNER_TEMP/dolphin-muos"
          bash dolphin-build/validate-aarch64-elf.sh "$OUT/dolphin"
          bash dolphin-build/validate-aarch64-elf.sh "$OUT/lib/libhidapi-hidraw.so.0"
          bash dolphin-rtcore-muos/tools/verify-muos-runtime-abi.sh "$OUT/dolphin" "$OUT/lib/libhidapi-hidraw.so.0"
          test -s "$OUT/Sys/GC/font_western.bin"
          test -s "$OUT/Sys/GC/font_japanese.bin"
          test -s "$OUT/Sys/GC/dsp_rom.bin"
          test -s "$OUT/Sys/GC/dsp_coef.bin"
          test -s "$OUT/Sys/Resources/OSD_Font.ttf"
          readelf -d "$OUT/dolphin" | grep -F 'libhidapi-hidraw.so.0'
          sha256sum "$OUT/dolphin" "$OUT/lib/libhidapi-hidraw.so.0"

      - name: Build complete muOS Andromeda update
        run: |
          OUT="$RUNNER_TEMP/dolphin-muos"
          mkdir -p "$OUT/dist"
          DOLPHIN_BIN="$OUT/dolphin" \
          DOLPHIN_SYS_DIR="$OUT/Sys" \
          DOLPHIN_LIB_DIR="$OUT/lib" \
            bash dolphin-rtcore-muos/tools/build-muxupd.sh "$OUT/dist"
          ARCHIVE="$(find "$OUT/dist" -maxdepth 1 -type f -name '*.muxupd' -print -quit)"
          test -n "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" > "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/emulator/dolphin/dolphin' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/emulator/dolphin/lib/libhidapi-hidraw.so.0' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/emulator/dolphin/Sys/GC/font_western.bin' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/emulator/dolphin/Sys/GC/dsp_rom.bin' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/info/assign/Nintendo GameCube/global.ini' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/info/assign/Nintendo GameCube/dolphin - rtprime - upright.ini' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/info/assign/Nintendo Wii/global.ini' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/info/assign/Nintendo Wii/dolphin - rtprime - upright.ini' "$OUT/archive-files.txt"
          grep -Fxq 'opt/muos/share/task/Dolphin Rt-Core/Diagnose ROM folders.sh' "$OUT/archive-files.txt"
          ! grep -Fxq 'run/muos/storage/application/Dolphin RtUI/data/settings.json' "$OUT/archive-files.txt"
          grep -Fxq 'manifest.sha256' "$OUT/archive-files.txt"
          bash dolphin-rtcore-muos/tools/verify-muxupd.sh "$ARCHIVE"
          sha256sum "$ARCHIVE" "$OUT/BUILDINFO.txt" "$OUT"/source-*.tar.xz > "$OUT/SHA256SUMS"
          cat "$OUT/SHA256SUMS"

      - name: Upload workflow artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dolphin-muos-andromeda-h700-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dolphin-muos/dist/*.muxupd
            ${{ runner.temp }}/dolphin-muos/BUILDINFO.txt
            ${{ runner.temp }}/dolphin-muos/source-*.tar.xz
            ${{ runner.temp }}/dolphin-muos/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish authenticated draft Release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'SilverCrow2323/dolphin-rt-core'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/dolphin-muos"
          ARCHIVE="$(find "$OUT/dist" -maxdepth 1 -type f -name '*.muxupd' -print -quit)"
          test -n "$ARCHIVE"
          VERSION="$(tr -d '[:space:]' < dolphin-rtcore-muos/VERSION)"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="v${VERSION}-rc-${SHORT_SHA}"
          printf '%s\n' \
            "# Dolphin Rt:Core v${VERSION} — H700 muOS build candidate" \
            "" \
            "Commit: ${GITHUB_SHA}" \
            "" \
            "This is an automatically generated draft candidate. The archive passed the AArch64 ELF, GLIBC, payload and MUXUPD integrity checks." \
            "" \
            "Physical-device boot/input/render/exit testing is still required. Jacaranda compatibility here covers the legacy info/assign payload and registration path; it is not a claim that the complete v12 runtime has been certified on Jacaranda." \
            > "$OUT/RELEASE_NOTES.md"
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$OUT/BUILDINFO.txt" "$OUT/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Dolphin Rt:Core v${VERSION} — H700 muOS candidate ${SHORT_SHA}" \
              --notes-file "$OUT/RELEASE_NOTES.md"
          else
            gh release create "$TAG" "$ARCHIVE" "$OUT/BUILDINFO.txt" "$OUT/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Dolphin Rt:Core v${VERSION} — H700 muOS candidate ${SHORT_SHA}" \
              --notes-file "$OUT/RELEASE_NOTES.md"
          fi
