name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.12"] } }
    defaults: { run: { working-directory: portal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-tk zip xvfb
          pip install lupa pillow
      - run: make lint
      - run: xvfb-run -a make test

  portal-packages:
    runs-on: ubuntu-latest
    needs: portal
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm zip
      - run: |
          make -C portal deb
          bash portal/tools/build-packages.sh rpm
          bash portal/tools/build-packages.sh arch
      - uses: actions/upload-artifact@v4
        with: { name: portal-packages, path: "portal/dist/**" }

  muos-andromeda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zip jq shellcheck luajit
      - name: Lua syntax (all UI modules)
        run: |
          find dolphin-rtcore-muos/app -name '*.lua' -print0 | xargs -0 -n1 luajit -bl >/dev/null
          luajit tests/test_stream_lib.lua 2>/dev/null || (cd "dolphin-rtcore-muos/app/Dolphin RtUI" && luajit ../../../tests/test_stream_lib.lua)
          luajit tests/test_nexus.lua
          luajit tests/test_stream_settings_nexus.lua
          luajit tests/test_stream_config_persistence.lua
          luajit tests/test_diagnostics_nexus.lua
          luajit tests/test_hotkeys_nexus.lua
          luajit tests/test_cheats_screen_nexus.lua
          luajit tests/test_game_nexus.lua
          luajit tests/test_keymap_nexus.lua
          luajit tests/test_controller_profiles_nexus.lua
          luajit tests/test_compat_nexus.lua
          luajit tests/test_cheatdb_nexus.lua
          luajit tests/test_safe_exit.lua
          luajit tests/test_muos_platform.lua
          luajit tests/test_app_input.lua
          luajit tests/test_gamesettings_deployer.lua
          luajit tests/test_gameset_active_config.lua
          luajit tests/test_gameset_loader_invalidate.lua
          luajit tests/test_boot_scan_async.lua
          luajit tests/test_folder_tools.lua
          luajit tests/test_profile_merger_shared_base.lua
          luajit tests/test_rt_profiles_tiers.lua
          bash tests/test_content_explorer_shared_profiles.sh
          python3 tests/test_rt_profile_merge.py
          python3 tests/test_project_gamesettings.py
          luajit tests/test_rom_auto_discovery.lua
          bash tests/test_rtui_stream_contract.sh
      - run: bash dolphin-rtcore-muos/tools/build-muxupd.sh dist
      - name: Run muOS Andromeda's own archive checks
        run: bash dolphin-rtcore-muos/tools/verify-muxupd.sh dist/*.muxupd
      - uses: actions/upload-artifact@v4
        with: { name: muxupd, path: dist/*.muxupd }

  ports-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test_ports_dryrun.sh
      - name: Test Knulli and ROCKNIX packaging with a matching Sys tree
        run: bash tests/test_port_sys_packaging.sh

  love-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dolphin-rtcore-muos/app/Dolphin RtUI
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE and virtual display
        run: sudo apt-get update && sudo apt-get install -y love xvfb
      - name: Exercise every declared LÖVE screen
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          xvfb-run -a love . --smoke
          test -s data/logs/smoke.txt
          grep -Fq "0 FAIL" data/logs/smoke.txt
          cat data/logs/smoke.txt
      - name: Capture every screen at supported display sizes
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          expected="$(sed -nE 's/^RESULT: ([0-9]+)\/([0-9]+) OK, 0 FAIL$/\2/p' data/logs/smoke.txt)"
          for resolution in 640x480 720x480 720x720; do
            output="$RUNNER_TEMP/dolphin-rtui-screenshots/$resolution"
            mkdir -p "$output"
            DOLPHINUI_RES="$resolution" bash ../../../tools/capture-ui.sh --all --delay 0.7 --out-dir "$output"
            actual="$(find "$output" -maxdepth 1 -type f -name '*.png' | wc -l)"
            test "$actual" -eq "$expected"
            python3 - "$output" "$resolution" <<'PY'
          from pathlib import Path
          import struct
          import sys

          folder = Path(sys.argv[1])
          expected_size = tuple(map(int, sys.argv[2].split("x")))
          images = sorted(folder.glob("*.png"))
          for image in images:
            with image.open("rb") as stream:
              header = stream.read(24)
            if header[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit(f"{image.name}: invalid PNG signature")
            actual_size = struct.unpack(">II", header[16:24])
            if actual_size != expected_size:
              raise SystemExit(f"{image.name}: {actual_size}, expected {expected_size}")
          print(f"Verified {len(images)} PNG dimensions at {sys.argv[2]}.")
          PY
            echo "Captured $actual/$expected screens at $resolution."
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-rtui-screen-captures
          path: "${{ runner.temp }}/dolphin-rtui-screenshots/**/*.png"
          if-no-files-found: error
          retention-days: 14

  repository-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manifest test dependency
        run: sudo apt-get update && sudo apt-get install -y jq zip unzip
      - name: Check helper syntax
        run: |
          bash -n tools/capture-ui.sh tools/publish-wiki.sh tools/build-compat-site.sh
          bash -n dolphin-build/build-dolphin.sh dolphin-build/verify-patches.sh dolphin-build/validate-aarch64-elf.sh tests/test_aarch64_elf_validator.sh
          bash -n "dolphin-rtcore-muos/app/Dolphin RtUI/scripts/launch.sh"
          bash -n "dolphin-rtcore-muos/app/Dolphin RtUI/scripts/ce_shared_profile_runtime.sh"
          bash -n "dolphin-rtcore-muos/overlay/opt/muos/script/launch/ext-dolphinrt.sh"
          bash -n dolphin-rtcore-muos/overlay/opt/muos/script/launch/ext-dolphinrt.sh
          sh -n dolphin-rtcore-muos/overlay/opt/muos/share/emulator/dolphin/RtSys/muos_platform.sh
          sh -n dolphin-rtcore-muos/overlay/opt/muos/share/emulator/dolphin/RtSys/manifest_tool.sh
          bash -n dolphin-rtcore-muos/overlay/opt/muos/share/emulator/dolphin/RtSys/switch_weapon/switch_weapon.sh
          bash -n tests/test_muos_registration.sh tests/test_dolphin_runtime_contract.sh tests/test_dolphin_sys_packaging.sh tests/test_port_sys_packaging.sh
          bash -n dolphin-rtcore-muos/emu/dolphin/RtSys/overlay_exit.sh
          bash -n "dolphin-rtcore-muos/app/Dolphin RtUI/scripts/overlay_exit.sh"
          sh -n "dolphin-rtcore-muos/app/Dolphin RtUI/tools/stream/discover.sh"
          bash tests/test_rtui_stream_contract.sh
          python -m py_compile tools/asset_inventory.py tests/test_repo_tools.py tests/test_compat_site.py tests/test_rt_profile_merge.py "dolphin-rtcore-muos/app/Dolphin RtUI/tools/rt_profile_merge.py" "dolphin-rtcore-muos/app/Dolphin RtUI/tools/project_gamesettings.py" tests/test_project_gamesettings.py
      - name: Test AArch64 ELF validation contract
        run: bash tests/test_aarch64_elf_validator.sh
      - name: Test muOS generation detection and core registration
        run: bash tests/test_muos_registration.sh
      - name: Test Dolphin muOS runtime contract
        run: bash tests/test_dolphin_runtime_contract.sh
      - name: Test Dolphin Sys packaging and manifest
        run: bash tests/test_dolphin_sys_packaging.sh
      - name: Test isolated experimental Qt 6 update package
        run: bash tests/test_dolphin_qt6_packaging.sh
      - name: Test Knulli and ROCKNIX packaging with a matching Sys tree
        run: bash tests/test_port_sys_packaging.sh
      - name: Test repository and website tooling
        run: python -m unittest tests/test_repo_tools.py tests/test_compat_site.py -v
