name: Deploy Dolphin Rt:Core Product Hub

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "compatibility.html"
      - "quick-start.html"
      - "profiles.html"
      - "gamesettings.html"
      - "docs.html"
      - "manifest.json"
      - "sw.js"
      - "assets/site.css"
      - "assets/site.js"
      - "assets/editorial.css"
      - "assets/magazine.js"
      - "assets/spdw_symbol.png"
      - "assets/dolphinrt_icon.png"
      - "assets/dolphin_rtcore_title.png"
      - "assets/gamecube.svg"
      - "assets/wii.svg"
      - "data/site-gamesettings-index.json"
      - "data/site-profiles.json"
      - "data/site-docs-index.json"
      - "dolphin-rtcore-muos/app/Dolphin RtUI/data/games_data.json"
      - "dolphin-rtcore-muos/app/Dolphin RtUI/data/gamesettings.json"
      - "tools/build-compat-site.sh"
      - ".github/workflows/deploy-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build complete Dolphin Rt:Core Product Hub
        run: bash tools/build-compat-site.sh "$RUNNER_TEMP/compatibility-site"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/compatibility-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Product Hub and Compatibility Database
        id: deployment
        uses: actions/deploy-pages@v4
